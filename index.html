<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pages IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Sidebar Styling */
    #sidebar {
      width: 360px;
      background: #18181c;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #282830;
    }
    #search-box {
      padding: 15px;
      background: #1f1f24;
      border-bottom: 1px solid #282830;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #file-input {
      width: 100%;
      padding: 8px;
      background: #0f0f12;
      border: 1px solid #33333d;
      border-radius: 8px;
      color: #aaa;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    #file-input::-webkit-file-upload-button {
      background: #007acc;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
    }
    #search-input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f12;
      border: 1px solid #33333d;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus {
      border-color: #007acc;
    }

    /* Country Filter Tabs */
    .tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 0;
      background: #282832;
      border: none;
      border-radius: 6px;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #333342;
      color: #fff;
    }
    .tab-btn.active {
      background: #007acc;
      color: #fff;
    }

    #channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .channel-item {
      padding: 12px 16px;
      border-bottom: 1px solid #22222a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s ease;
    }
    .channel-item:hover {
      background: #252530;
    }
    .channel-item.active {
      background: #007acc;
      color: #fff;
    }
    
    .logo-container {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #282832;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .channel-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .channel-fallback {
      font-weight: bold;
      font-size: 11px;
      color: #888899;
      text-transform: uppercase;
    }
    
    .channel-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .channel-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-country {
      font-size: 11px;
      color: #777788;
      margin-top: 2px;
    }

    /* Video Player Container */
    #player-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      outline: none;
    }
    #loading {
      position: absolute;
      font-size: 15px;
      color: #ffffff;
      background: rgba(0,0,0,0.85);
      padding: 12px 24px;
      border-radius: 20px;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="search-box">
      <input type="file" id="file-input" accept=".m3u, .m3u8" onchange="handleFileUpload(event)" />
      <input type="text" id="search-input" placeholder="Search channels..." oninput="filterChannels()" />
      <div class="tabs">
        <button class="tab-btn active" onclick="setCountryFilter('ALL', this)">ALL</button>
        <button class="tab-btn" onclick="setCountryFilter('US', this)">🇺🇸 USA</button>
        <button class="tab-btn" onclick="setCountryFilter('UK', this)">🇬🇧 UK</button>
        <button class="tab-btn" onclick="setCountryFilter('JP', this)">🇯🇵 Japan</button>
      </div>
    </div>
    <ul id="channel-list" onscroll="handleScroll()"></ul>
  </div>

  <div id="player-container">
    <div id="loading">Upload an M3U file to load channels</div>
    <video id="video" controls autoplay></video>
  </div>

  <script>
    const PROXY_BASE = 'https://iptv-cors-proxy.minhqdr4n5.workers.dev/?url=';
    
    let allChannels = [];
    let currentFilteredChannels = [];
    let selectedCountry = 'ALL';
    let displayedCount = 0;
    const PAGE_SIZE = 80;

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const channelListEl = document.getElementById('channel-list');
    let hls = null;

    // Read the uploaded file locally
    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      loading.innerText = 'Reading file...';
      loading.style.display = 'block';

      const reader = new FileReader();
      reader.onload = function (e) {
        const text = e.target.result;
        allChannels = parseM3U(text);
        
        loading.style.display = 'none';
        if (allChannels.length === 0) {
          loading.innerText = 'No valid channels found in file.';
          loading.style.display = 'block';
        }
        filterChannels();
      };

      reader.onerror = function () {
        loading.innerText = 'Failed to read playlist file.';
        console.error(reader.error);
      };

      reader.readAsText(file);
    }

    // Parse M3U with metadata extraction
    function parseM3U(m3uText) {
      const lines = m3uText.split('\n');
      const parsedChannels = [];
      let currentChannel = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          let name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unknown Channel';
          
          if (name.includes('http-user-agent=')) {
            name = name.split('group-title=')[1] || name;
            name = name.replace(/^"[^"]*"/, '').replace(/^,[^,]*,/, '').trim();
          }

          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';

          const countryMatch = line.match(/tvg-country="([^"]+)"/);
          let countryCode = countryMatch ? countryMatch[1].toUpperCase() : 'TV';

          // Detect common country codes or fallback to playlist metadata
          if (line.includes('group-title="USA"') || line.includes('tvg-country="US"')) countryCode = 'US';
          else if (line.includes('group-title="UK"') || line.includes('tvg-country="GB"')) countryCode = 'UK';
          else if (line.includes('group-title="Japan"') || line.includes('tvg-country="JP"')) countryCode = 'JP';

          let countryName = countryCode;
          if (countryCode === 'US') countryName = 'USA';
          else if (countryCode === 'UK' || countryCode === 'GB') countryName = 'UK';
          else if (countryCode === 'JP') countryName = 'Japan';

          currentChannel = { name, logo, countryCode, countryName };
        } else if (line && !line.startsWith('#')) {
          if (currentChannel) {
            currentChannel.url = line;
            parsedChannels.push(currentChannel);
            currentChannel = null;
          }
        }
      }
      return parsedChannels;
    }

    // Filter by Tab & Search Input
    function setCountryFilter(code, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCountry = code;
      filterChannels();
    }

    function filterChannels() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      currentFilteredChannels = allChannels.filter(ch => {
        const matchesCountry = (selectedCountry === 'ALL') || (ch.countryCode === selectedCountry);
        const matchesSearch = ch.name.toLowerCase().includes(query);
        return matchesCountry && matchesSearch;
      });

      renderNextBatch(true);
    }

    // Lazy load channel list
    function renderNextBatch(reset = false) {
      if (reset) {
        channelListEl.innerHTML = '';
        displayedCount = 0;
      }

      const nextBatch = currentFilteredChannels.slice(displayedCount, displayedCount + PAGE_SIZE);

      nextBatch.forEach((channel) => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        
        const logoDiv = document.createElement('div');
        logoDiv.className = 'logo-container';
        
        if (channel.logo) {
          const img = document.createElement('img');
          img.className = 'channel-logo';
          img.src = channel.logo;
          img.onerror = () => {
            logoDiv.innerHTML = `<span class="channel-fallback">${channel.countryCode}</span>`;
          };
          logoDiv.appendChild(img);
        } else {
          logoDiv.innerHTML = `<span class="channel-fallback">${channel.countryCode}</span>`;
        }

        const infoDiv = document.createElement('div');
        infoDiv.className = 'channel-info';

        const title = document.createElement('span');
        title.className = 'channel-title';
        title.innerText = channel.name;

        const sub = document.createElement('span');
        sub.className = 'channel-country';
        sub.innerText = channel.countryName;

        infoDiv.appendChild(title);
        infoDiv.appendChild(sub);

        li.appendChild(logoDiv);
        li.appendChild(infoDiv);

        li.onclick = () => playStream(channel.url, li);
        channelListEl.appendChild(li);
      });

      displayedCount += nextBatch.length;
    }

    function handleScroll() {
      if (channelListEl.scrollTop + channelListEl.clientHeight >= channelListEl.scrollHeight - 200) {
        if (displayedCount < currentFilteredChannels.length) {
          renderNextBatch(false);
        }
      }
    }

    // Optimized Stream Playback Logic
    function playStream(url, element) {
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      loading.innerText = 'Connecting to stream...';
      loading.style.display = 'block';

      const targetStreamUrl = PROXY_BASE + encodeURIComponent(url);

      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          maxBufferLength: 15,
          maxMaxBufferLength: 30,
          maxBufferHole: 0.5,
          highBufferWatchdogPeriod: 2,
          nudgeMaxRetry: 5,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 3,
          levelLoadingTimeOut: 10000,
          fragLoadingTimeOut: 10000,
          xhrSetup: function (xhr, reqUrl) {
            if (!reqUrl.startsWith(PROXY_BASE)) {
              xhr.open('GET', PROXY_BASE + encodeURIComponent(reqUrl), true);
            }
          }
        });

        hls.loadSource(targetStreamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          loading.style.display = 'none';
          video.play().catch(e => console.log('Autoplay blocked:', e));
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                console.warn('Network error, attempting recovery...');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                console.warn('Media error, attempting recovery...');
                hls.recoverMediaError();
                break;
              default:
                loading.innerText = 'Stream offline or unavailable';
                loading.style.display = 'block';
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = targetStreamUrl;
        video.play();
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>

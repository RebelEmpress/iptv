<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pages IPTV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Sidebar Styling */
    #sidebar {
      width: 360px;
      background: #18181c;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #282830;
    }
    #search-box {
      padding: 15px;
      background: #1f1f24;
      border-bottom: 1px solid #282830;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    #search-input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f12;
      border: 1px solid #33333d;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus {
      border-color: #007acc;
    }

    /* Country Filter Tabs */
    .tabs {
      display: flex;
      gap: 6px;
    }
    .tab-btn {
      flex: 1;
      padding: 6px 0;
      background: #282832;
      border: none;
      border-radius: 6px;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: #333342;
      color: #fff;
    }
    .tab-btn.active {
      background: #007acc;
      color: #fff;
    }

    #channel-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .channel-item {
      padding: 12px 16px;
      border-bottom: 1px solid #22222a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s ease;
    }
    .channel-item:hover {
      background: #252530;
    }
    .channel-item.active {
      background: #007acc;
      color: #fff;
    }
    
    .logo-container {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #282832;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .channel-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .channel-fallback {
      font-weight: bold;
      font-size: 11px;
      color: #888899;
      text-transform: uppercase;
    }
    
    .channel-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .channel-title {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .channel-country {
      font-size: 11px;
      color: #777788;
      margin-top: 2px;
    }

    /* Video Player Container */
    #player-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      outline: none;
    }
    #loading {
      position: absolute;
      font-size: 15px;
      color: #888899;
      background: rgba(0,0,0,0.8);
      padding: 12px 24px;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="search-box">
      <input type="text" id="search-input" placeholder="Search channels..." oninput="filterChannels()" />
      <div class="tabs">
        <button class="tab-btn active" onclick="setCountryFilter('ALL', this)">ALL</button>
        <button class="tab-btn" onclick="setCountryFilter('US', this)">🇺🇸 USA</button>
        <button class="tab-btn" onclick="setCountryFilter('UK', this)">🇬🇧 UK</button>
        <button class="tab-btn" onclick="setCountryFilter('JP', this)">🇯🇵 Japan</button>
      </div>
    </div>
    <ul id="channel-list" onscroll="handleScroll()"></ul>
  </div>

  <div id="player-container">
    <div id="loading">Loading USA, UK & Japan channels...</div>
    <video id="video" controls autoplay></video>
  </div>

  <script>
    const PROXY_BASE = 'https://iptv-cors-proxy.minhqdr4n5.workers.dev/?url=';
    
    // Country-specific M3U sources
    const PLAYLISTS = [
      { code: 'US', name: 'USA', url: 'https://iptv-org.github.io/iptv/countries/us.m3u' },
      { code: 'UK', name: 'UK', url: 'https://iptv-org.github.io/iptv/countries/uk.m3u' },
      { code: 'JP', name: 'Japan', url: 'https://iptv-org.github.io/iptv/countries/jp.m3u' }
    ];
    
    let allChannels = [];
    let currentFilteredChannels = [];
    let selectedCountry = 'ALL';
    let displayedCount = 0;
    const PAGE_SIZE = 80;

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const channelListEl = document.getElementById('channel-list');
    let hls = null;

    // Fetch and combine country playlists
    async function loadPlaylists() {
      try {
        const fetchPromises = PLAYLISTS.map(async (pl) => {
          const proxiedUrl = PROXY_BASE + encodeURIComponent(pl.url);
          const res = await fetch(proxiedUrl);
          const text = await res.text();
          return parseM3U(text, pl.code, pl.name);
        });

        const results = await Promise.all(fetchPromises);
        allChannels = results.flat();
        
        loading.style.display = 'none';
        filterChannels();
      } catch (error) {
        loading.innerText = 'Failed to load channels.';
        console.error(error);
      }
    }

    // Parse M3U
    function parseM3U(m3uText, countryCode, countryName) {
      const lines = m3uText.split('\n');
      const parsedChannels = [];
      let currentChannel = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          let name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Unknown Channel';
          
          if (name.includes('http-user-agent=')) {
            name = name.split('group-title=')[1] || name;
            name = name.replace(/^"[^"]*"/, '').replace(/^,[^,]*,/, '').trim();
          }

          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          const logo = logoMatch ? logoMatch[1] : '';

          currentChannel = { name, logo, countryCode, countryName };
        } else if (line && !line.startsWith('#')) {
          if (currentChannel) {
            currentChannel.url = line;
            parsedChannels.push(currentChannel);
            currentChannel = null;
          }
        }
      }
      return parsedChannels;
    }

    // Filter by Tab & Search Input
    function setCountryFilter(code, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCountry = code;
      filterChannels();
    }

    function filterChannels() {
      const query = document.getElementById('search-input').value.toLowerCase();
      
      currentFilteredChannels = allChannels.filter(ch => {
        const matchesCountry = (selectedCountry === 'ALL') || (ch.countryCode === selectedCountry);
        const matchesSearch = ch.name.toLowerCase().includes(query);
        return matchesCountry && matchesSearch;
      });

      renderNextBatch(true);
    }

    // Lazy load channel list
    function renderNextBatch(reset = false) {
      if (reset) {
        channelListEl.innerHTML = '';
        displayedCount = 0;
      }

      const nextBatch = currentFilteredChannels.slice(displayedCount, displayedCount + PAGE_SIZE);

      nextBatch.forEach((channel) => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        
        const logoDiv = document.createElement('div');
        logoDiv.className = 'logo-container';
        
        if (channel.logo) {
          const img = document.createElement('img');
          img.className = 'channel-logo';
          img.src = channel.logo;
          img.onerror = () => {
            logoDiv.innerHTML = `<span class="channel-fallback">${channel.countryCode}</span>`;
          };
          logoDiv.appendChild(img);
        } else {
          logoDiv.innerHTML = `<span class="channel-fallback">${channel.countryCode}</span>`;
        }

        const infoDiv = document.createElement('div');
        infoDiv.className = 'channel-info';

        const title = document.createElement('span');
        title.className = 'channel-title';
        title.innerText = channel.name;

        const sub = document.createElement('span');
        sub.className = 'channel-country';
        sub.innerText = channel.countryName;

        infoDiv.appendChild(title);
        infoDiv.appendChild(sub);

        li.appendChild(logoDiv);
        li.appendChild(infoDiv);

        li.onclick = () => playStream(channel.url, li);
        channelListEl.appendChild(li);
      });

      displayedCount += nextBatch.length;
    }

    function handleScroll() {
      if (channelListEl.scrollTop + channelListEl.clientHeight >= channelListEl.scrollHeight - 200) {
        if (displayedCount < currentFilteredChannels.length) {
          renderNextBatch(false);
        }
      }
    }

    // Stream playback logic
    function playStream(url, element) {
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      const targetStreamUrl = PROXY_BASE + encodeURIComponent(url);

      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({
          xhrSetup: function (xhr, reqUrl) {
            if (!reqUrl.startsWith(PROXY_BASE)) {
              xhr.open('GET', PROXY_BASE + encodeURIComponent(reqUrl), true);
            }
          }
        });

        hls.loadSource(targetStreamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(e => console.log('Autoplay blocked:', e));
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.warn('Stream failed or offline:', data);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = targetStreamUrl;
        video.play();
      }
    }

    loadPlaylists();
  </script>
</body>
</html>
